[package]
name = "camazotz"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/camazotz"
homepage = "https://github.com/savageAZfck/camazotz"
license = "MIT"
description = "Certified erasure: per-subject keys, crypto-shredding with verified decrypt-failure, consent revocation, incidental-mention purging, and signed proof-of-deletion certificates — named for the Maya bat god"
keywords = ["erasure", "gdpr", "privacy", "deletion", "crypto-shredding"]
categories = ["cryptography"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
ed25519-dalek = "2"
rand = "0.8"

[features]
default = []
